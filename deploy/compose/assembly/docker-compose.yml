services:
  assembly:
    build:
      context: ./../../../
      dockerfile: deploy/docker/assembly/Dockerfile
    container_name: assembly-services
    env_file:
      - ./.env # путь к env относительно compose-файла
    restart: unless-stopped
    networks:
      - microservices-net

networks:
  microservices-net:
    name: microservices-net
    external: true
