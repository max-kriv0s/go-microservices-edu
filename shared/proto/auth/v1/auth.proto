syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";
import "common/v1/session.proto";
import "common/v1/user.proto";

option go_package = "github.com/max-kriv0s/go-microservices-edu/shared/pkg/proto/auth/v1;auth_v1";

// AuthService
service AuthService {
  // Login пользователя
  rpc Login(LoginRequest) returns(LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  };

  // Получение данных пользователя
  rpc Whoami(WhoamiRequest) returns(WhoamiResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/whoami"
      body: "*"
    };
  };
}

// LoginRequest - запрос
message LoginRequest {
  string login    = 1; // Логин пользователя;
  string password = 2; // Пароль пользователя;
}

// LoginResponse - ответ
message LoginResponse {
  string session_uuid = 1; // UUID активной сессии;
}

// WhoamiRequest - запрос
message WhoamiRequest {
  string session_uuid = 1; // UUID активной сессии;
}

// WhoamiResponse - ответ
message WhoamiResponse {
  common.v1.Session session = 1; // Информация о текущей сессии;
  common.v1.User    user    = 2; // Владелец текущей сессии;
}
