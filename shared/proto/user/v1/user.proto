syntax = "proto3";

package user.v1;

import "common/v1/user.proto";

option go_package = "github.com/max-kriv0s/go-microservices-edu/shared/pkg/proto/user/v1;user_v1";

service UserService {
    rpc Register(RegisterRequest) returns(RegisterResponse); // Регистрация пользователя
    rpc GetUser(GetUserRequest) returns(GetUserResponse); // Получение данных о пользователе
}

// UserRegistrationInfo - информация для регистрации
message UserRegistrationInfo {
    common.v1.UserInfo info = 1; // Основная информация пользователя
    string password = 2; // Пароль
}

// RegisterRequest - запрос
message RegisterRequest {
    UserRegistrationInfo info = 1;
}

// RegisterResponse - ответ
message RegisterResponse {
    string user_uuid = 1; // UUID созданного пользователя
}

// GetUserRequest - запрос
message GetUserRequest {
    string user_uuid = 1; // UUID пользователя
}

// GetUserResponse - ответ
message GetUserResponse {
    common.v1.User user = 1; // Пользователь
}
